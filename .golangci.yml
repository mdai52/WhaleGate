run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - bodyclose
    - nilerr

linters-settings:
  goimports:
    local-prefixes: github.com/whalegate/whalegate
  govet:
    enable:
      - shadow
  revive:
    rules:
      - name: exported
        disabled: true

issues:
  exclude-use-default: true
  max-issues-per-linter: 0
  max-same-issues: 0
