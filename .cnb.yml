main:
  push:
    - name: 质量检查
      stages:
        - name: 后端检查与测试
          image: golang:1.23
          script: |
            cd WhaleGate-backend
            echo "== gofmt =="
            test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
            echo "== vet =="
            go vet ./...
            echo "== test =="
            go test ./...
        - name: 前端检查与构建
          image: node:22-alpine
          script: |
            cd WhaleGate-frontend
            npm install --no-audit --no-fund
            npx vue-tsc --noEmit
            npm run build

    - name: 推送镜像制品
      services:
        - docker
      env:
        IMAGE: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG}/whalegate
        TAG: ${CNB_COMMIT_SHORT}
      stages:
        - name: 构建并推送
          image: docker:27-cli
          script: |
            docker login -u ${CNB_TOKEN_USER_NAME} -p ${CNB_TOKEN} ${CNB_DOCKER_REGISTRY}
            docker build --build-arg VERSION=${CNB_COMMIT_SHORT} -t $IMAGE:$TAG -t $IMAGE:latest .
            docker push $IMAGE:$TAG
            docker push $IMAGE:latest
            echo "已推送 $IMAGE:$TAG"

$:
  tag_push:
    - name: 发布版本镜像
      services:
        - docker
      env:
        IMAGE: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG}/whalegate
      stages:
        - name: 构建并推送
          image: docker:27-cli
          script: |
            docker login -u ${CNB_TOKEN_USER_NAME} -p ${CNB_TOKEN} ${CNB_DOCKER_REGISTRY}
            docker build --build-arg VERSION=${CNB_BRANCH} -t $IMAGE:${CNB_BRANCH} -t $IMAGE:latest .
            docker push $IMAGE:${CNB_BRANCH}
            docker push $IMAGE:latest
            echo "已发布 $IMAGE:${CNB_BRANCH}"

  pull_request:
    - name: 变更检查
      stages:
        - name: 后端测试
          image: golang:1.23
          script: |
            cd WhaleGate-backend
            go vet ./...
            go test ./...
        - name: 前端类型检查
          image: node:22-alpine
          script: |
            cd WhaleGate-frontend
            npm install --no-audit --no-fund
            npx vue-tsc --noEmit
