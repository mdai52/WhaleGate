root = "."
tmp_dir = "tmp"

[build]
  cmd = "cd WhaleGate-backend && go build -o ../tmp/whalegate ./cmd/whalegate"
  bin = "../tmp/whalegate"
  full_bin = "cd WhaleGate-backend && ../tmp/whalegate -c configs/config.yaml"
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["tmp", "bin", "WhaleGate-frontend", "WhaleGate-backend/migrations"]
  delay = 1000
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
