name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.23"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WhaleGate-backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: whalegate
          POSTGRES_PASSWORD: whalegate
          POSTGRES_DB: whalegate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U whalegate"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      WG_DATABASE_HOST: 127.0.0.1
      WG_DATABASE_PORT: "5432"
      WG_REDIS_HOST: 127.0.0.1
      WG_REDIS_PORT: "6379"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: WhaleGate-backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go' | sed 's|^WhaleGate-backend/||'))
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61
          working-directory: WhaleGate-backend
          args: --timeout=5m

      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o ../bin/whalegate ./cmd/whalegate

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: WhaleGate-backend/coverage.out
          if-no-files-found: ignore

  frontend:
    name: Frontend (Vue3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WhaleGate-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: WhaleGate-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: WhaleGate-frontend/dist
          if-no-files-found: error

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: whalegate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
